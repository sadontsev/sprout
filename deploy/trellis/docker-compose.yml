services:
  trellis:
    build: .
    container_name: bambu-trellis
    restart: unless-stopped
    # Host network so it reaches Bambuddy at localhost:8910 and exposes its own :8911 on the host.
    network_mode: host
    # Everything in .env reaches the container, so an optional setting needs no line here.
    # .env.example is the reference for what may go in it — self-hosting the push path, MakerWorld
    # collections, and so on. Listing those here meant this file grew a paragraph of explanation
    # per variable and read as though six Apple credentials were mandatory. They are not; the
    # normal deployment sets exactly one thing.
    env_file:
      - .env
    environment:
      # Fixed container paths, not configuration.
      BAMBUDDY_URL: http://localhost:8910
      APNS_KEY_PATH: /keys/apns_key.p8
      DATA_DIR: /data
      BAMBUDDY_DB: /bambuddy/bambuddy.db
      # The one required value, restated here only so `:?` can stop the deploy. A bare
      # ${BAMBUDDY_API_KEY} interpolates to the EMPTY STRING, which os.environ reports as present —
      # Trellis then booted fine and every Bambuddy call answered 401, which reads as "Bambuddy is
      # broken" and sends you to the wrong service.
      BAMBUDDY_API_KEY: ${BAMBUDDY_API_KEY:?set BAMBUDDY_API_KEY in .env — see .env.example}
      # Production APNs unless .env says otherwise. Only read when signing locally; TestFlight
      # Live-Activity tokens are production-environment, and pushing them at sandbox gets 400
      # BadDeviceToken with the registration dropped — observed live, every card died silently.
      APNS_HOST: ${APNS_HOST:-api.push.apple.com}
    volumes:
      # Your own APNs auth key. Override APNS_KEY_FILE in .env if you keep it elsewhere.
      # Harmless in RELAY mode, where nothing reads it.
      - ${APNS_KEY_FILE:-${HOME}/.config/sprout/apns_key.p8}:/keys/apns_key.p8:ro
      - ./data:/data
      # READ-ONLY, deliberately: this service must never be able to write another app's database.
      # Comment this out (and BAMBUDDY_DB above) if you do not want the MakerWorld collection
      # endpoints — everything else works without it.
      - bambuddy_data:/bambuddy:ro

volumes:
  # Bambuddy's own volume, joined from outside its compose project. The name is the one docker
  # compose generated for it — `bambuddy_bambuddy_data`, project prefix and all — NOT the bare
  # `bambuddy_data`, which also exists on this host and is an empty leftover. Mounting the empty one
  # fails silently: no database, so collections report "can't see Bambuddy's database" forever.
  # Verify with `docker volume ls | grep bambuddy` and
  # `docker inspect bambuddy --format '{{range .Mounts}}{{.Name}}{{end}}'`.
  bambuddy_data:
    external: true
    name: ${BAMBUDDY_VOLUME:-bambuddy_bambuddy_data}
