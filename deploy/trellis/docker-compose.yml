services:
  trellis:
    build: .
    container_name: bambu-trellis
    restart: unless-stopped
    # Host network so it reaches Bambuddy at localhost:8910 and exposes its own :8911 on the host.
    network_mode: host
    # This file is PUSH ONLY, and needs one value: BAMBUDDY_API_KEY.
    #
    # MakerWorld collections are an overlay — docker-compose.collections.yml — because they need
    # Bambuddy's docker volume, declared `external`, and an external volume that does not exist
    # makes compose refuse to start the container AT ALL. As part of this file that turned a
    # collections misconfiguration into "no push", reported as a volume name rather than as the
    # feature that was actually lost.
    #
    # Everything in .env reaches the container, so an optional setting needs no line here.
    env_file:
      - .env
    environment:
      # Required for BOTH features, and the only value most deployments set. Trellis polls Bambuddy
      # with it and validates the key the app presents against Bambuddy too.
      #
      # `:?` so an unset or empty key stops the deploy: written as a bare ${BAMBUDDY_API_KEY} it
      # interpolated to the EMPTY STRING, which os.environ reports as present, so Trellis booted
      # fine and every Bambuddy call answered 401 — which reads as "Bambuddy is broken" and sends
      # you to the wrong service.
      BAMBUDDY_API_KEY: ${BAMBUDDY_API_KEY:?set BAMBUDDY_API_KEY in .env — see .env.example}
    volumes:
      # Trellis's own state — registrations, tenant credentials, edge-detection.
      - ./data:/data
