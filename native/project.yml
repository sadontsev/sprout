name: Sprout
options:
  bundleIdPrefix: com.mvks5
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: false

settings:
  base:
    DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}   # export it, or put it in native/.env-local (gitignored)
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "36"
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    # Conditioned, not project-wide. As a bare "1" this also reached the macOS build, where the
    # setting has no meaning — harmless, but it reads as a claim that the Mac app is an iPhone app.
    "TARGETED_DEVICE_FAMILY[sdk=iphone*]": "1"
    ENABLE_MODULE_VERIFIER: NO
    # What the macOS app bundle is CALLED. Defined once here because two targets have to agree about
    # it: the app names its product with it, and SproutTests points TEST_HOST at the result. They were
    # briefly two literals, and the moment the Debug name changed the Mac test action stopped building
    # with "Could not find test host" — a coupling worth having exactly one source for.
    SPROUT_MAC_APP: Sprout

  configs:
    Debug:
      # See `targets.Sprout.settings.configs.Debug` for why a Debug Mac build is a separate app.
      SPROUT_MAC_APP: Sprout Dev

targets:
  Sprout:
    type: application
    # One target, two destinations — NOT Mac Catalyst, and not "Designed for iPad". The Mac build
    # is a native AppKit-backed SwiftUI app that shares Api/, Domain/, Config/ and Theme with iOS
    # and forks only at the view layer. See docs/native-rewrite/18-mac-port-architecture.md.
    supportedDestinations: [iOS, macOS]
    sources:
      - path: Sprout
      - path: Shared
    dependencies:
      # The Live Activity extension is iOS-only: macOS has no ActivityKit, and its Mac equivalent
      # is the menu bar extra (§6). Without a filter the macOS build FAILS trying to build an
      # iOS-only target.
      #
      # `platformFilter:`, NOT `platforms:`. §0 of the handoff specifies `platforms: [iOS]`; that key
      # does not filter an embed, it removes the embed phase ENTIRELY — the iOS app then builds and
      # installs perfectly with no PlugIns directory and no Live Activity at all. Measured on both
      # destinations:
      #
      #     platforms: [iOS]      iOS appex MISSING   macOS build ok
      #     platformFilter: iOS   iOS appex PRESENT   macOS build ok     <- correct
      #     (no filter)           iOS appex PRESENT   macOS build FAILS
      #
      # Worth stating how this got through once: it was "verified" by checking the appex was absent
      # from the MAC bundle, which it was — and also absent from the iOS one. Confirming the
      # negative is not confirming the positive.
      - target: SproutWidget
        embed: true
        platformFilter: iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mvks5.bambu
        PRODUCT_NAME: Sprout
        # Pinned, because `PRODUCT_NAME` drives THREE things and the Debug Mac build changes it:
        # the bundle wrapper, the executable, and the Swift MODULE name. Renaming the product to
        # "Sprout Dev" silently renamed the module to `Sprout_Dev`, and every one of the 1,293 tests
        # failed to compile on `@testable import Sprout`. The module is an identifier in source, not
        # a user-facing name, so it must never follow the product name.
        PRODUCT_MODULE_NAME: Sprout
        INFOPLIST_FILE: Sprout/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: Sprout
        # Substituted into CFBundleDisplayName below, so a CONFIGURATION can change what the app is
        # called without changing PRODUCT_NAME. `PRODUCT_NAME` is deliberately left alone: it names
        # the bundle and the executable, and every script and probe invocation in this repo says
        # `Sprout.app/Contents/MacOS/Sprout`.
        SPROUT_APP_NAME: Sprout
        ENABLE_PREVIEWS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        SDKROOT: auto
        SUPPORTS_MACCATALYST: NO
        # Xcode build-setting conditionals, NOT a `macos:` key beside `base:`. xcodegen has no such
        # key for a multiplatform target and drops the whole block WITHOUT AN ERROR — which silently
        # ships a Mac app with no sandbox and no hardened runtime while the build stays green.
        "CODE_SIGN_ENTITLEMENTS[sdk=iphone*]": Sprout/Resources/Sprout.entitlements
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": Sprout/Resources/Sprout-macOS.entitlements
        "ENABLE_HARDENED_RUNTIME[sdk=macosx*]": YES
        # Substituted into NSPrincipalClass in the shared Info.plist below.
        #
        # Xcode injects this key only when it GENERATES the plist. Sprout uses an explicit
        # INFOPLIST_FILE, so it was simply absent from the Mac bundle. Set here because every
        # Xcode-generated macOS app has it and a bundle that omits it is relying on an AppKit
        # default rather than declaring what it is — not because it was observed to break anything.
        # It has to be conditional: NSApplication is wrong on iOS, where the value is UIApplication.
        "SPROUT_PRINCIPAL_CLASS[sdk=macosx*]": NSApplication
        "SPROUT_PRINCIPAL_CLASS[sdk=iphone*]": UIApplication
        # macOS builds from a DERIVED copy of the shared plist — see the preBuildScript.
        "INFOPLIST_FILE[sdk=macosx*]": "$(DERIVED_FILE_DIR)/Info-macOS.plist"
      configs:
        Release:
          # The dev icon is a RESOURCE on this target, and target membership is not
          # configuration-scoped — only `ASSETCATALOG_COMPILER_APPICON_NAME` is. So actool compiled
          # `SproutDev.icon` into the SHIPPED asset catalog on both platforms: measured at 211,732
          # bytes of the iOS Release catalog, for artwork no shipped build can ever select.
          #
          # Worth naming how it got through: build 33's commit claimed "Release is unchanged… still
          # Sprout icon", and the check behind that claim read `CFBundleIconName` — which verifies
          # which icon Release SELECTS, not what Release SHIPS. The repo's own nearby-question shape,
          # in verification form.
          EXCLUDED_SOURCE_FILE_NAMES: SproutDev.icon
        # A macOS Debug build is a DIFFERENT APP from the one on TestFlight.
        #
        # All builds shared one bundle id, which meant one Launch Services identity and — the part
        # that actually bit — one preferences domain. Running a local build to take a screenshot
        # read and wrote the same `mac.section` and inspector state as the installed TestFlight app,
        # so a probe run could leave the real app on a different screen. Spotlight listed three
        # identical "Sprout" entries with no way to tell which was which.
        #
        # macOS only, and Debug only:
        #   - iOS keeps the production id, so APNs, App Attest and Live Activity testing on a real
        #     iPhone are untouched. Those are iOS-only subjects anyway.
        #   - Release is untouched on both platforms, so nothing about shipping changes.
        #
        # The cost, stated because it is easy to forget later: a Mac dev build will not receive
        # push. APNs topics are bundle ids and Canopy binds `com.mvks5.bambu`, so a push aimed at
        # the real app cannot arrive here. It also starts with an empty Keychain, so the server URL
        # and API key are entered once — which is the isolation working, not a fault.
        Debug:
          "PRODUCT_BUNDLE_IDENTIFIER[sdk=macosx*]": com.mvks5.bambu.dev
          "SPROUT_APP_NAME[sdk=macosx*]": Sprout Dev
          "ASSETCATALOG_COMPILER_APPICON_NAME[sdk=macosx*]": SproutDev
          # The BUNDLE is renamed too, and it has to be: Spotlight labels an app from
          # `kMDItemFSName` — the filename on disk — not from `CFBundleDisplayName`. Setting the
          # display name alone produced a bundle whose plist read "Sprout Dev" while Spotlight
          # cheerfully listed a third identical "Sprout". Measured with `mdls`, which also showed the
          # index still holding the OLD bundle id for that path after a rebuild; renaming the wrapper
          # sidesteps that staleness, because it becomes a different path.
          "PRODUCT_NAME[sdk=macosx*]": "$(SPROUT_MAC_APP)"
          # …but the EXECUTABLE keeps its name, so `Contents/MacOS/Sprout` is still the binary and the
          # probe invocations in CLAUDE.md need only the new wrapper name. `EXECUTABLE_NAME` defaults
          # to `PRODUCT_NAME`; splitting them is what lets the app be renamed without renaming the
          # thing every script in this repo executes.
          "EXECUTABLE_NAME[sdk=macosx*]": Sprout
    preBuildScripts:
      # Derive the macOS Info.plist from the iOS one, minus the single key macOS refuses.
      #
      # Deriving rather than committing a second plist: the two would differ by ONE key and share
      # sixty, including CFBundleDocumentTypes and UTImportedTypeDeclarations — the declarations
      # that make drag-and-drop, Finder "Open with" and Quick Look work. Two hand-maintained copies
      # of those would drift, and the drift would look like a platform bug rather than a typo.
      #
      # Runs before ProcessInfoPlistFile, which is where the macOS build fails on the key: a
      # post-processing phase would be too late, because the failure IS that step.
      - name: Derive macOS Info.plist
        inputFiles:
          - $(SRCROOT)/Sprout/Resources/Info.plist
        # Declared so Xcode orders this BEFORE ProcessInfoPlistFile. Without the declaration the
        # macOS build fails with "Build input file cannot be found" — the file is produced, just
        # not in the dependency graph, so nothing knows to wait for it.
        outputFiles:
          - $(DERIVED_FILE_DIR)/Info-macOS.plist
        script: |
          mkdir -p "$DERIVED_FILE_DIR"
          cp "$SRCROOT/Sprout/Resources/Info.plist" "$DERIVED_FILE_DIR/Info-macOS.plist"
          # Written on BOTH platforms, because a declared output that does not appear fails the
          # build — and only macOS reads it. The key is removed only where it is a problem.
          if [ "$PLATFORM_NAME" = "macosx" ]; then
            # `|| true`: absent is the desired end state, so a Delete that finds nothing succeeded.
            /usr/libexec/PlistBuddy -c "Delete :LSSupportsOpeningDocumentsInPlace" \
              "$DERIVED_FILE_DIR/Info-macOS.plist" || true
          fi
    info:
      path: Sprout/Resources/Info.plist
      properties:
        CFBundleDisplayName: "$(SPROUT_APP_NAME)"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        # NSApplication on macOS, UIApplication on iOS — see SPROUT_PRINCIPAL_CLASS above for why
        # this cannot be hard-coded in a plist shared by two platforms.
        NSPrincipalClass: "$(SPROUT_PRINCIPAL_CLASS)"
        # Read on macOS (Finder, the App Store category, Launchpad grouping); ignored on iOS, where
        # the category comes from App Store Connect.
        LSApplicationCategoryType: public.app-category.utilities
        UILaunchScreen:
          UIColorName: LaunchBackground
        # Portrait-locked, like the RN build: every screen is laid out for it, and the fullscreen
        # camera does its own rotation. Allowing native landscape too would rotate twice.
        #
        # UIRequiresFullScreen is REQUIRED alongside this: App Store Connect rejects a bundle that
        # declares fewer than all four orientations without opting out of iPad multitasking
        # ("you need to include all of the ... orientations"), even for an iPhone-only app.
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # PiP keeps the app alive via a near-silent audio session — see CameraRenderer.
        UIBackgroundModes:
          - audio
        ITSAppUsesNonExemptEncryption: false
        # `false` because Sprout COPIES an opened document into the library rather than editing the
        # user's file where it sits. Both platforms behave that way; only their tolerance differs.
        #
        # iOS REQUIRES the key once CFBundleDocumentTypes is declared — App Store Connect returns
        # warning 90737 without it ("All document-based apps must include one of these
        # configurations"), which is exactly what build 22 shipped with after this was dropped.
        # macOS REFUSES it at `false` and fails the build outright, and setting it to YES there
        # would claim an in-place editing model the app does not have.
        #
        # So the honest value differs per platform: present-and-false on iOS, absent on macOS. A
        # build-setting substitution cannot express "absent", so the macOS plist is derived from
        # this one by the script phase below — one source of truth, one deleted key.
        LSSupportsOpeningDocumentsInPlace: false
        NSSupportsLiveActivities: true
        NSSupportsLiveActivitiesFrequentUpdates: true
        NSPhotoLibraryAddUsageDescription: Save printed-model snapshots and timelapses to your photo library.
        NSLocalNetworkUsageDescription: Sprout talks to your self-hosted Bambuddy server, which may be on your local network.
        CFBundleURLTypes:
          - CFBundleURLName: com.mvks5.bambu
            CFBundleURLSchemes: [bambu]
        CFBundleDocumentTypes:
          - CFBundleTypeName: 3MF Model
            LSHandlerRank: Owner
            LSItemContentTypes: [com.bambulab.3mf]
          - CFBundleTypeName: Bambu Sliced 3MF
            LSHandlerRank: Owner
            LSItemContentTypes: [com.bambulab.gcode-3mf]
          - CFBundleTypeName: G-code
            LSHandlerRank: Owner
            LSItemContentTypes: [com.bambulab.gcode]
          - CFBundleTypeName: STL Model
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.standard-tesselated-geometry-format]
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: com.bambulab.3mf
            UTTypeDescription: 3MF Model
            UTTypeConformsTo: [public.data, public.zip-archive]
            UTTypeTagSpecification:
              public.filename-extension: [3mf]
              public.mime-type: [model/3mf, application/vnd.ms-package.3dmanufacturing-3dmodel+xml]
          - UTTypeIdentifier: com.bambulab.gcode-3mf
            UTTypeDescription: Bambu Sliced 3MF
            UTTypeConformsTo: [com.bambulab.3mf]
            UTTypeTagSpecification:
              public.filename-extension: [gcode.3mf]
          - UTTypeIdentifier: com.bambulab.gcode
            UTTypeDescription: G-code
            UTTypeConformsTo: [public.text, public.data]
            UTTypeTagSpecification:
              public.filename-extension: [gcode]
              public.mime-type: [text/x.gcode]

  SproutWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: SproutWidget
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mvks5.bambu.LiveActivity
        PRODUCT_NAME: SproutWidget
        INFOPLIST_FILE: SproutWidget/Info.plist
        CODE_SIGN_ENTITLEMENTS: SproutWidget/SproutWidget.entitlements
        SKIP_INSTALL: YES
    info:
      path: SproutWidget/Info.plist
      properties:
        CFBundleDisplayName: Sprout
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  SproutTests:
    type: bundle.unit-test
    # Both destinations, so the domain layer is proven on the platform it actually runs on rather
    # than assumed to port. The suite is pure logic over Domain/ and the decoders, so every case
    # is meaningful on macOS too.
    supportedDestinations: [iOS, macOS]
    sources:
      - path: SproutTests
    # Hosted by the app rather than recompiling its sources, so `@testable import Sprout` sees the
    # one real build of every type instead of a duplicate set.
    dependencies:
      - target: Sprout
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mvks5.bambu.tests
        GENERATE_INFOPLIST_FILE: YES
        # xcodegen writes ONE TEST_HOST, in the iOS bundle layout (`Sprout.app/Sprout`). A macOS
        # app keeps its binary at `Sprout.app/Contents/MacOS/Sprout`, so the unconditional value
        # points at a path that does not exist and the Mac test action fails before running a
        # single case ("Could not find test host for SproutTests"). Conditionals win over the
        # unconditional setting, so naming both layouts fixes macOS without touching iOS.
        #
        # `$(SPROUT_MAC_APP)`, not a literal `Sprout`: the Debug Mac app is `Sprout Dev.app`, and a
        # hard-coded name here points at a bundle that exists in Release and not in Debug. The
        # EXECUTABLE is still `Sprout` in both, which is why only the wrapper is substituted.
        "TEST_HOST[sdk=macosx*]": "$(BUILT_PRODUCTS_DIR)/$(SPROUT_MAC_APP).app/Contents/MacOS/Sprout"
        "BUNDLE_LOADER[sdk=macosx*]": "$(BUILT_PRODUCTS_DIR)/$(SPROUT_MAC_APP).app/Contents/MacOS/Sprout"

schemes:
  Sprout:
    build:
      targets:
        Sprout: all
        SproutWidget: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - SproutTests
    archive:
      config: Release
