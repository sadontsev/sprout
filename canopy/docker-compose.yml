services:
  canopy:
    build: .
    container_name: canopy
    restart: unless-stopped
    # Runs as the host user rather than the image's nonroot uid, so the bind-mounted data directory
    # is writable without loosening its permissions. The image itself carries no shell and no libc;
    # this only changes which uid the single binary runs under.
    user: "${CANOPY_UID:-1000}:${CANOPY_GID:-1000}"
    # Reachable from the host LAN so a tunnel can front it. This is the process holding the APNs
    # signing keys, so publishing it comes with a condition rather than on its own: set
    # CANOPY_INVITE_CODE. Every other endpoint needs a tenant bearer, but enrolment is open by
    # design, and open enrolment on a public address is an invitation to accumulate tenants nobody
    # asked for. The invite gate is the valve the design specifies for exactly this moment.
    ports:
      - "8914:8914"
    environment:
      CANOPY_ADDR: "0.0.0.0:8914"
      CANOPY_DB: /data/canopy.db
      CANOPY_BUNDLE_ID: ${CANOPY_BUNDLE_ID:?set CANOPY_BUNDLE_ID in .env}
      CANOPY_TEAM_ID: ${CANOPY_TEAM_ID:?set CANOPY_TEAM_ID in .env}
      # One key per environment. A legacy universal key may be pointed at both paths; an
      # environment-scoped key only works for its own gateway, and the BadDeviceToken retry against
      # the other one will answer InvalidProviderToken rather than converging.
      CANOPY_APNS_KEY_SANDBOX: /keys/apns_key.p8
      CANOPY_APNS_KEY_ID_SANDBOX: ${CANOPY_APNS_KEY_ID:?set CANOPY_APNS_KEY_ID in .env}
      CANOPY_APNS_KEY_PRODUCTION: /keys/apns_key.p8
      CANOPY_APNS_KEY_ID_PRODUCTION: ${CANOPY_APNS_KEY_ID:?set CANOPY_APNS_KEY_ID in .env}
      CANOPY_APPLE_ROOT_CA: /keys/apple-app-attest-root.pem
      # Permits Apple's DEVELOPMENT App Attest environment, which a locally-installed build uses.
      # Leave it off once only TestFlight and App Store builds talk to this.
      CANOPY_ALLOW_DEVELOPMENT_ATTEST: ${CANOPY_ALLOW_DEVELOPMENT_ATTEST:-1}
      CANOPY_INVITE_CODE: ${CANOPY_INVITE_CODE:-}
      # Apple's fraud-assessment metric: how many App Attest keys one device has minted. Optional,
      # and all three go together — unset means the sweep never runs and every other check is
      # unaffected. This is an APP STORE CONNECT key, NOT the APNs key above: that one authorises
      # sending a push, this one authorises reading Apple's per-device risk data. Supplying the
      # wrong .p8 here fails at startup rather than silently assessing nothing.
      #
      # The path is set only when a key id is, so an unconfigured deployment passes an empty path
      # and the sweep stays off. Pointing it at the always-present mount below instead would make
      # Canopy try to parse whatever is there and exit at startup.
      CANOPY_ASC_KEY: ${CANOPY_ASC_KEY_ID:+/keys/asc_key.p8}
      CANOPY_ASC_KEY_ID: ${CANOPY_ASC_KEY_ID:-}
      CANOPY_ASC_ISSUER_ID: ${CANOPY_ASC_ISSUER_ID:-}
    volumes:
      - ${APNS_KEY_FILE:-${HOME}/.config/sprout/apns_key.p8}:/keys/apns_key.p8:ro
      # Always mounted, read only when CANOPY_ASC_KEY names it. A bind mount whose source does not
      # exist is created by Docker as a DIRECTORY, so defaulting this to a real file is what keeps
      # an unconfigured deployment from acquiring a junk path it will later trip over.
      - ${ASC_KEY_FILE:-${APNS_KEY_FILE:-${HOME}/.config/sprout/apns_key.p8}}:/keys/asc_key.p8:ro
      - ${APPLE_ROOT_CA_FILE:-${HOME}/.config/sprout/apple-app-attest-root.pem}:/keys/apple-app-attest-root.pem:ro
      # Bindings and attest keys are durable state, not a cache: a device cannot re-attest on
      # demand, so losing this costs every install a re-attestation round it has no way to know it
      # needs. Back it up.
      - ./data:/data
